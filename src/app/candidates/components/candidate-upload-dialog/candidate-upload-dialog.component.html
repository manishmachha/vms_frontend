<div class="dialog-container">
  <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
    <h2 class="text-xl font-semibold text-gray-900" mat-dialog-title>Upload Resume</h2>
    <button (click)="close()" class="text-gray-400 hover:text-gray-500 transition-colors">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <mat-dialog-content class="px-6 py-6 custom-scroll">
    <div class="space-y-6">
      
      <!-- Drag & Drop Area -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Resume File <span class="text-red-500">*</span></label>
        
        <div *ngIf="!selectedFile()"
             class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-lg hover:border-indigo-500 hover:bg-indigo-50/30 transition-all cursor-pointer"
             (dragover)="onDragOver($event)"
             (drop)="onDrop($event)"
             (click)="fileInput.click()">
          
          <div class="space-y-2 text-center">
            <i class="bi bi-cloud-arrow-up text-4xl text-gray-400"></i>
            <div class="flex flex-col text-sm text-gray-600">
              <span class="relative bg-transparent rounded-md font-medium text-indigo-600 hover:text-indigo-500">
                Click to upload or drag and drop
              </span>
              <p class="text-xs text-gray-500 mt-1">PDF, DOCX, TXT up to 10MB</p>
            </div>
            <input #fileInput type="file" class="hidden" (change)="onFileSelected($event)" accept=".pdf,.docx,.txt" />
          </div>
        </div>

        <!-- Selected File Preview -->
        <div *ngIf="selectedFile()" class="mt-1 flex items-center justify-between p-4 border border-indigo-200 bg-indigo-50 rounded-lg">
          <div class="flex items-center space-x-3 overflow-hidden">
            <div class="p-2 bg-indigo-100 rounded-md">
              <i class="bi bi-file-earmark-text text-indigo-600 text-lg"></i>
            </div>
            <div class="truncate">
              <p class="text-sm font-medium text-indigo-900 truncate">{{ selectedFile()?.name }}</p>
              <p class="text-xs text-indigo-500">{{ (selectedFile()!.size / 1024 / 1024).toFixed(2) }} MB</p>
            </div>
          </div>
          <button (click)="removeFile()" class="p-1.5 text-indigo-400 hover:text-red-500 hover:bg-white rounded-md transition-colors" title="Remove file">
            <i class="bi bi-trash"></i>
          </button>
        </div>
      </div>

      <!-- Source Selection -->
      <div>
        <label for="source" class="block text-sm font-medium text-gray-700 mb-2">Source <span class="text-red-500">*</span></label>
        <select id="source" 
                [ngModel]="selectedSource()" 
                (ngModelChange)="selectedSource.set($event)"
                class="block w-full pl-3 pr-10 py-2.5 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md shadow-sm">
          <option *ngFor="let src of sources" [value]="src">{{ src }}</option>
        </select>
      </div>

      <!-- Other Source Input -->
      <div *ngIf="selectedSource() === 'Others'" class="animate-in fade-in slide-in-from-top-2 duration-200">
        <label for="other-source" class="block text-sm font-medium text-gray-700 mb-2">Specify Source <span class="text-red-500">*</span></label>
        <input type="text" 
               id="other-source"
               [ngModel]="otherSourceText()"
               (ngModelChange)="otherSourceText.set($event)"
               placeholder="e.g. Indeed, Glassdoor..."
               class="block w-full shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm border-gray-300 rounded-md py-2.5 px-3">
      </div>

      <!-- Error Message -->
      <div *ngIf="uploadError()" class="p-4 rounded-md bg-red-50 border border-red-100 flex items-start space-x-3">
        <i class="bi bi-exclamation-triangle text-red-500 mt-0.5"></i>
        <p class="text-sm text-red-700">{{ uploadError() }}</p>
      </div>

    </div>
  </mat-dialog-content>

  <mat-dialog-actions class="px-6 py-4 border-t border-gray-200 flex justify-end gap-3 mb-0">
    <button type="button" 
            (click)="close()" 
            class="px-4 py-2 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
      Cancel
    </button>
    <button type="button" 
            (click)="onSubmit()"
            [disabled]="!selectedFile()"
            class="px-4 py-2 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center space-x-2">
      <i class="bi bi-upload"></i>
      <span>Upload & Parse</span>
    </button>
  </mat-dialog-actions>
</div>

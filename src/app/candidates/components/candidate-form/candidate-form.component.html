<div class="max-w-4xl mx-auto p-6 space-y-8">
  <!-- Header -->
  <div class="md:flex md:items-center md:justify-between">
    <div class="min-w-0 flex-1">
      <h2
        class="text-2xl font-bold leading-7 text-gray-900 sm:truncate sm:text-3xl sm:tracking-tight"
      >
        Edit Candidate
      </h2>
    </div>
  </div>



  <!-- Form -->
  <form
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    class="bg-white shadow sm:rounded-lg p-6 space-y-6"
  >
    <h3 class="text-lg font-medium leading-6 text-gray-900 mb-4">Candidate Details</h3>

    <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-6">
      <div class="sm:col-span-3">
        <label for="first-name" class="block text-sm font-medium text-gray-700 mb-1"
          >First name</label
        >
        <div class="mt-1">
          <!-- First Name -->
          <input
            type="text"
            formControlName="firstName"
            id="first-name"
            placeholder="Enter first name"
            class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full px-4 py-3 sm:text-base border-gray-300 rounded-lg"
          />
        </div>
      </div>

      <div class="sm:col-span-3">
        <label for="last-name" class="block text-sm font-medium text-gray-700 mb-1"
          >Last name</label
        >
        <div class="mt-1">
          <input
            type="text"
            formControlName="lastName"
            id="last-name"
            placeholder="Enter last name"
            class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full px-4 py-3 sm:text-base border-gray-300 rounded-lg"
          />
        </div>
      </div>

      <div class="sm:col-span-4">
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1"
          >Email address</label
        >
        <div class="mt-1">
          <input
            id="email"
            formControlName="email"
            type="email"
            placeholder="Enter email address (e.g. john.doe@email.com)"
            class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full px-4 py-3 sm:text-base border-gray-300 rounded-lg"
          />
        </div>
      </div>

      <div class="sm:col-span-3">
        <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
        <div class="mt-1">
          <input
            type="text"
            formControlName="phone"
            id="phone"
            maxlength="10"
            pattern="[0-9]*"
            placeholder="Enter phone number (e.g. 9876543210)"
            class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full px-4 py-3 sm:text-base border-gray-300 rounded-lg"
          />
        </div>
      </div>

      <div class="sm:col-span-3">
        <label for="city" class="block text-sm font-medium text-gray-700 mb-1">City</label>
        <div class="mt-1">
          <input
            type="text"
            formControlName="city"
            id="city"
            placeholder="Enter current city (e.g. Hyderabad)"
            class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full px-4 py-3 sm:text-base border-gray-300 rounded-lg"
          />
        </div>
      </div>

      <div class="sm:col-span-3">
        <label for="designation" class="block text-sm font-medium text-gray-700 mb-1"
          >Current Designation</label
        >
        <div class="mt-1">
          <input
            type="text"
            formControlName="currentDesignation"
            id="designation"
            placeholder="e.g. Senior Java Developer"
            class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full px-4 py-3 sm:text-base border-gray-300 rounded-lg"
          />
        </div>
      </div>

      <div class="sm:col-span-3">
        <label for="company" class="block text-sm font-medium text-gray-700 mb-1"
          >Current Company</label
        >
        <div class="mt-1">
          <input
            type="text"
            formControlName="currentCompany"
            id="company"
            placeholder="e.g. Solventek"
            class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full px-4 py-3 sm:text-base border-gray-300 rounded-lg"
          />
        </div>
      </div>

      <div class="sm:col-span-3">
        <label for="experience" class="block text-sm font-medium text-gray-700 mb-1"
          >Experience (Years)</label
        >
        <div class="mt-1">
          <input
            type="number"
            formControlName="experienceYears"
            id="experience"
            placeholder="Enter total experience (e.g. 4)"
            class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full px-4 py-3 sm:text-base border-gray-300 rounded-lg"
          />
        </div>
      </div>

      <div class="sm:col-span-6">
        <label for="skills" class="block text-sm font-medium text-gray-700 mb-1"
          >Skills (comma separated)</label
        >
        <div class="mt-1">
          <input
            type="text"
            formControlName="skills"
            id="skills"
            placeholder="e.g. Java, Spring Boot, Angular, AWS"
            class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full px-4 py-3 sm:text-base border-gray-300 rounded-lg"
          />
        </div>
      </div>

      <div class="sm:col-span-3">
        <label for="linkedin" class="block text-sm font-medium text-gray-700 mb-1"
          >LinkedIn URL</label
        >
        <div class="mt-1">
          <input
            type="text"
            formControlName="linkedInUrl"
            id="linkedin"
            placeholder="e.g. https://linkedin.com/in/username"
            class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full px-4 py-3 sm:text-base border-gray-300 rounded-lg"
          />
        </div>
      </div>

      <div class="sm:col-span-3">
        <label for="portfolio" class="block text-sm font-medium text-gray-700 mb-1"
          >Portfolio URL</label
        >
        <div class="mt-1">
          <input
            type="text"
            formControlName="portfolioUrl"
            id="portfolio"
            placeholder="Enter portfolio URL"
            class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full px-4 py-3 sm:text-base border-gray-300 rounded-lg"
          />
        </div>
      </div>

      <div class="sm:col-span-6">
        <label for="summary" class="block text-sm font-medium text-gray-700 mb-1">Summary</label>
        <div class="mt-1">
          <textarea
            id="summary"
            formControlName="summary"
            rows="4"
            placeholder="Write a short summary about the candidate (experience, strengths, key skills...)"
            class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full px-4 py-3 sm:text-base border-gray-300 rounded-lg"
          ></textarea>
        </div>
      </div>


    </div>

    <!-- Actions -->
    <div class="flex justify-end pt-5">
      <button
        type="button"
        [routerLink]="resolvePath('/candidates')"
        class="bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
      >
        Cancel
      </button>
      <button
        type="submit"
        [disabled]="form.invalid"
        class="ml-3 inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50"
      >
        Save
      </button>
    </div>
  </form>
</div>

<div class="space-y-6">
  <!-- Search and Filter Toolbar -->
  <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col md:flex-row gap-4 items-center justify-between">
    <div class="relative flex-1 w-full">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <i class="bi bi-search text-gray-400"></i>
      </div>
      <input
        type="text"
        [(ngModel)]="searchText"
        (input)="onSearchOrFilter()"
        placeholder="Search candidate or job title..."
        class="block w-full pl-10 pr-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
      />
    </div>
    <select
      [(ngModel)]="statusFilter"
      (change)="onSearchOrFilter()"
      class="block w-full md:w-48 pl-3 pr-8 py-2 text-sm border border-gray-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
    >
      <option value="">All Statuses</option>
      <option value="APPLIED">Applied</option>
      <option value="SHORTLISTED">Shortlisted</option>
      <option value="INTERVIEW_SCHEDULED">Interview Scheduled</option>
      <option value="OFFERED">Offered</option>
      <option value="ONBOARDED">Onboarded</option>
      <option value="REJECTED">Rejected</option>
    </select>
  </div>

  <div class="bg-white shadow overflow-hidden sm:rounded-md border border-gray-200">
    <ul role="list" class="divide-y divide-gray-200">
      <li *ngFor="let app of applications()">
        <div class="px-4 py-4 flex items-center sm:px-6 hover:bg-gray-50 transition-colors">
          <div class="min-w-0 flex-1 sm:flex sm:items-center sm:justify-between">
            <div class="truncate">
              <div class="flex text-sm">
                <p class="font-medium text-indigo-600 truncate">
                  {{ app.job.title }}
                </p>
                <p class="ml-1 shrink-0 font-normal text-gray-500">
                  - {{ app.candidate.firstName }} {{ app.candidate.lastName }}
                </p>
              </div>
              <div class="mt-2 flex">
                <div class="flex items-center text-sm text-gray-500">
                  <i class="bi bi-building mr-1.5 text-gray-400"></i>
                  <p>{{ app.job.organization?.name || 'Client' }}</p>
                </div>
                <span class="mx-2 text-gray-300">|</span>
                <div class="flex items-center text-sm text-gray-500">
                  <i class="bi bi-clock mr-1.5 text-gray-400"></i>
                  <p>Applied {{ app.createdAt | date }}</p>
                </div>
              </div>
            </div>
          </div>
          <div class="ml-5 shrink-0 flex items-center gap-4">
            <span
              class="px-2 py-1 text-xs font-semibold rounded-full"
              [ngClass]="{
                'bg-yellow-100 text-yellow-800': app.status === 'APPLIED',
                'bg-blue-100 text-blue-800': app.status === 'SHORTLISTED',
                'bg-purple-100 text-purple-800':
                  app.status === 'INTERVIEW_SCHEDULED' || app.status === 'INTERVIEW_PASSED',
                'bg-green-100 text-green-800':
                  app.status === 'OFFERED' ||
                  app.status === 'ONBOARDED' ||
                  app.status === 'CONVERTED_TO_FTE',
                'bg-red-100 text-red-800':
                  app.status === 'REJECTED' ||
                  app.status === 'DROPPED' ||
                  app.status === 'INTERVIEW_FAILED',
              }"
            >
              {{ app.status }}
            </span>
            <i class="bi bi-chevron-right text-gray-400"></i>
          </div>
        </div>
      </li>
      <li *ngIf="applications().length === 0" class="px-4 py-12 text-center text-gray-500">
        No applications found.
      </li>
    </ul>
    <mat-paginator
      [length]="totalElements"
      [pageSize]="pageSize"
      [pageIndex]="currentPage"
      [pageSizeOptions]="[10, 20, 50]"
      (page)="onPageChange($event)"
      showFirstLastButtons
      class="border-t border-gray-100"
    ></mat-paginator>
  </div>
</div>

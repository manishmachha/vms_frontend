<header class="flex items-center justify-between px-4 md:px-6 gap-4"
  [class.h-[76px]]="!isRunningInShell"
  [class.h-auto]="isRunningInShell"
  [class.flex-wrap]="isRunningInShell">

  <!-- Shell Navigation Bar (only when running inside the shell) -->
  <div *ngIf="isRunningInShell"
    class="w-full bg-slate-900/95 backdrop-blur-md -mx-4 md:-mx-6 -mt-0 px-4 md:px-6 py-2 flex items-center justify-between border-b border-white/10 shadow-sm">
    <!-- Logo -->
    <a (click)="navigateToShellRoute('/')" class="flex items-center gap-3 group cursor-pointer shrink-0">
      <div class="p-1 rounded-xl shadow-lg group-hover:scale-105 transition-all duration-500 shrink-0">
        <img src="Solventek_logo.png" alt="Solventek" class="w-auto object-contain h-8 transition-all duration-500" />
      </div>
      <span class="font-bold tracking-tight text-white group-hover:text-blue-400 transition-all duration-500 leading-none text-lg hidden sm:inline">
        Solventek
      </span>
    </a>

    <!-- Desktop Nav Links -->
    <div class="hidden lg:flex items-center gap-1 bg-slate-800/50 p-1 rounded-full border border-white/10 backdrop-blur-sm">
      <a (click)="navigateToShellRoute('/')"
        class="px-4 py-1.5 rounded-full text-slate-300 font-medium hover:text-white hover:bg-white/10 transition-all duration-300 text-sm cursor-pointer">
        Home
      </a>
      <a (click)="navigateToShellRoute('/vms')"
        class="px-4 py-1.5 rounded-full font-medium transition-all duration-300 text-sm cursor-pointer"
        [class.bg-blue-600]="isActiveMfe('vms')" [class.text-white]="isActiveMfe('vms')" [class.shadow-md]="isActiveMfe('vms')"
        [class.text-slate-300]="!isActiveMfe('vms')" [class.hover:text-white]="!isActiveMfe('vms')" [class.hover:bg-white/10]="!isActiveMfe('vms')">
        VMS Portal
      </a>
      <a (click)="navigateToShellRoute('/hrms')"
        class="px-4 py-1.5 rounded-full font-medium transition-all duration-300 text-sm cursor-pointer"
        [class.bg-blue-600]="isActiveMfe('hrms')" [class.text-white]="isActiveMfe('hrms')" [class.shadow-md]="isActiveMfe('hrms')"
        [class.text-slate-300]="!isActiveMfe('hrms')" [class.hover:text-white]="!isActiveMfe('hrms')" [class.hover:bg-white/10]="!isActiveMfe('hrms')">
        HRMS Portal
      </a>
      <a (click)="navigateToShellRoute('/contact')"
        class="px-4 py-1.5 rounded-full text-slate-300 font-medium hover:text-white hover:bg-white/10 transition-all duration-300 text-sm cursor-pointer">
        Contact Us
      </a>
    </div>

    <!-- Mobile Shell Menu Toggle -->
    <div class="lg:hidden relative">
      <button (click)="shellMenuOpen = !shellMenuOpen"
        class="p-2 rounded-lg text-white hover:bg-white/10 transition-colors">
        <i class="bi text-xl" [class.bi-list]="!shellMenuOpen" [class.bi-x-lg]="shellMenuOpen"></i>
      </button>
      <!-- Mobile Dropdown -->
      <div *ngIf="shellMenuOpen"
        class="absolute right-0 top-full mt-1 w-48 bg-slate-800 rounded-xl shadow-xl border border-white/10 overflow-hidden z-50">
        <a (click)="navigateToShellRoute('/'); shellMenuOpen = false"
          class="block px-4 py-2.5 text-sm text-slate-300 hover:bg-white/10 hover:text-white transition-colors cursor-pointer">
          Home
        </a>
        <a (click)="navigateToShellRoute('/vms'); shellMenuOpen = false"
          class="block px-4 py-2.5 text-sm transition-colors cursor-pointer"
          [class.bg-blue-600]="isActiveMfe('vms')" [class.text-white]="isActiveMfe('vms')"
          [class.text-slate-300]="!isActiveMfe('vms')" [class.hover:bg-white/10]="!isActiveMfe('vms')" [class.hover:text-white]="!isActiveMfe('vms')">
          VMS Portal
        </a>
        <a (click)="navigateToShellRoute('/hrms'); shellMenuOpen = false"
          class="block px-4 py-2.5 text-sm transition-colors cursor-pointer"
          [class.bg-blue-600]="isActiveMfe('hrms')" [class.text-white]="isActiveMfe('hrms')"
          [class.text-slate-300]="!isActiveMfe('hrms')" [class.hover:bg-white/10]="!isActiveMfe('hrms')" [class.hover:text-white]="!isActiveMfe('hrms')">
          HRMS Portal
        </a>
        <a (click)="navigateToShellRoute('/contact'); shellMenuOpen = false"
          class="block px-4 py-2.5 text-sm text-slate-300 hover:bg-white/10 hover:text-white transition-colors cursor-pointer">
          Contact Us
        </a>
      </div>
    </div>
  </div>

  <!-- Original Header Content -->
  <div class="flex items-center justify-between w-full py-3" [class.py-0]="!isRunningInShell">
    <!-- Left: Menu Toggle + Title -->
    <div class="flex items-center gap-3 md:gap-4 shrink-0">
      <!-- Mobile Menu Toggle -->
      <button
        (click)="toggleSidebar.emit()"
        class="md:hidden p-2 rounded-lg text-gray-500 hover:text-gray-900 hover:bg-gray-100 transition-colors"
        aria-label="Toggle menu"
      >
        <i
          class="bi"
          [class.bi-list]="!sidebarOpen"
          [class.bi-x-lg]="sidebarOpen"
          class="text-xl"
        ></i>
      </button>

      <!-- Dynamic Title with Icon -->
      <div class="flex items-center gap-3">
        <div
          class="hidden sm:flex p-2.5 rounded-xl bg-linear-to-br from-indigo-500 to-purple-600 text-white shadow-lg shadow-indigo-500/25"
        >
        <i [class]="headerService.icon() + ' text-lg'"></i>
        </div>
        <div>
          <h1 class="text-lg md:text-xl font-bold text-gray-900 leading-tight">
            {{ headerService.title() }}
          </h1>
          <p
            class="text-xs md:text-sm text-gray-500 font-medium hidden sm:block"
            *ngIf="headerService.subtitle()"
          >
            {{ headerService.subtitle() }}
          </p>
        </div>
      </div>
    </div>

    <!-- Right: Actions -->
    <div class="flex items-center gap-2 md:gap-4 shrink-0">
      <!-- Notification Dropdown -->
      <app-notification-dropdown></app-notification-dropdown>

      <!-- User Profile -->
      <div class="flex items-center gap-2 md:gap-3 pl-2 md:pl-4 border-l border-gray-200">
        <!-- User Avatar -->
        <a
          [routerLink]="mfeNav.basePath + '/profile'"
          class="h-8 w-8 rounded-full overflow-hidden block cursor-pointer hover:opacity-80 transition-opacity"
          title="View Profile"
        >
          <app-user-avatar
            [user]="authStore.user()"
            class="h-full w-full"
            fontSizeClass="text-sm"
          >
          </app-user-avatar>
        </a>

        <!-- User Info (Hidden on mobile) -->
        <div class="hidden md:block text-right">
          <p class="text-sm font-semibold text-gray-900">
            {{ user()?.firstName }} {{ user()?.lastName }}
          </p>
          <p class="text-xs text-gray-500">{{ formatRole(user()?.role) }}</p>
        </div>

        <!-- Logout Button -->
        <button
          (click)="logout()"
          class="p-2 rounded-lg text-gray-400 hover:text-red-600 hover:bg-red-50 transition-all"
          title="Logout"
        >
          <i class="bi bi-box-arrow-right text-lg"></i>
        </button>
      </div>
    </div>
  </div>
</header>
